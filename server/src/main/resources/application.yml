spring:
  application:
    name: dinomutation-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dinomutation}
    username: ${DB_USER:dino}
    password: ${DB_PASSWORD:dino}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 30d
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  cookie:
    secure: ${COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui
