# Postgres for local development: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dinomutation
      POSTGRES_USER: dino
      POSTGRES_PASSWORD: dino
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
